<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحبا بك - السيد هامبولا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #003d82 0%, #0066cc 50%, #4da6ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #003d82 0%, #0066cc 50%, #4da6ff 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Top Bar - College Info */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 30px;
            gap: 10px;
            z-index: 10;
        }

        .college-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .college-logo {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .college-logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .college-text {
            color: white;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
            text-align: right;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            position: relative;
        }

        /* Robot and Speech Bubble Container */
        .robot-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Speech Bubble */
        .speech-bubble {
            background: white;
            color: #003d82;
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 220px;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            position: absolute;
            top: 20%;
            left: 15%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: fadeInDown 0.8s ease-out 0.2s both;
            z-index: 5;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: -8px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-top: 8px solid white;
        }

        /* Robot SVG Animation */
        .robot {
            width: 280px;
            height: 300px;
            animation: float 3.5s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bottom Button Section */
        .bottom-section {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            z-index: 15;
        }

        .start-button {
            width: 100%;
            max-width: 300px;
            padding: 16px 50px;
            background: linear-gradient(135deg, #ff9933 0%, #ffb84d 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 153, 51, 0.4);
            animation: slideUp 0.8s ease-out 0.5s both;
        }

        .start-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 153, 51, 0.5);
        }

        .start-button:active {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Bar with College Info -->
        <div class="top-bar">
            <div class="college-header">
                <div class="college-text">الكلية التقنية الإدارية</div>
                <div class="college-logo">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <!-- Academic Cap Icon -->
                        <path d="M12 2l10 5v2l-10 5-10-5V7l10-5z" fill="white"/>
                        <path d="M2 9v9c0 2 4 4 10 4s10-2 10-4V9" fill="white" opacity="0.8"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="robot-container">
                <!-- Speech Bubble -->
                <div class="speech-bubble">
                    Mr.Hambula<br/>جاهز وبخدمتك
                </div>

                <!-- Robot SVG -->
                <svg class="robot" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Robot Body (Head) -->
                    <rect x="20" y="30" width="60" height="50" rx="8" fill="#e8f4f8" stroke="#0066cc" stroke-width="2"/>
                    
                    <!-- Robot Eyes -->
                    <circle cx="35" cy="45" r="6" fill="#0066cc"/>
                    <circle cx="65" cy="45" r="6" fill="#0066cc"/>
                    
                    <!-- Eye Shine -->
                    <circle cx="36" cy="44" r="2" fill="white"/>
                    <circle cx="66" cy="44" r="2" fill="white"/>
                    
                    <!-- Robot Mouth -->
                    <path d="M 40 58 Q 50 62 60 58" stroke="#0066cc" stroke-width="2" fill="none" stroke-linecap="round"/>
                    
                    <!-- Nose -->
                    <rect x="47" y="50" width="6" height="4" fill="#0066cc"/>
                    
                    <!-- Antennae Left -->
                    <line x1="30" y1="30" x2="25" y2="10" stroke="#ff9933" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="25" cy="8" r="4" fill="#ff9933"/>
                    
                    <!-- Antennae Right -->
                    <line x1="70" y1="30" x2="75" y2="10" stroke="#ff9933" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="75" cy="8" r="4" fill="#ff9933"/>
                    
                    <!-- Body -->
                    <rect x="25" y="85" width="50" height="30" rx="5" fill="#0066cc"/>
                    
                    <!-- Body Panel Line -->
                    <line x1="25" y1="100" x2="75" y2="100" stroke="#e8f4f8" stroke-width="1"/>
                    
                    <!-- Arms Left -->
                    <g>
                        <line x1="25" y1="92" x2="10" y2="95" stroke="#0066cc" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="9" cy="95" r="4" fill="#ff9933"/>
                    </g>
                    
                    <!-- Arms Right -->
                    <g>
                        <line x1="75" y1="92" x2="90" y2="95" stroke="#0066cc" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="91" cy="95" r="4" fill="#ff9933"/>
                    </g>
                    
                    <!-- Chest Light -->
                    <rect x="40" y="92" width="20" height="8" rx="2" fill="#ffb84d" opacity="0.8"/>
                    <line x1="45" y1="92" x2="45" y2="100" stroke="#ff9933" stroke-width="1" opacity="0.6"/>
                    <line x1="50" y1="92" x2="50" y2="100" stroke="#ff9933" stroke-width="1" opacity="0.6"/>
                    <line x1="55" y1="92" x2="55" y2="100" stroke="#ff9933" stroke-width="1" opacity="0.6"/>
                    
                    <!-- Connection to Body Glow -->
                    <circle cx="50" cy="85" r="12" fill="#ff9933" opacity="0.1"/>
                </svg>
            </div>
        </main>

        <!-- Bottom Button -->
        <section class="bottom-section">
            <button class="start-button" id="startBtn">ابدأ الدردشة</button>
        </section>
    </div>

    <script>
        // Start button functionality
        document.getElementById('startBtn').addEventListener('click', function() {
            // Add click animation
            this.style.transform = 'scale(0.98)';
            setTimeout(() => {
                this.style.transform = '';
                // Redirect to chat page or trigger chat modal
                console.log('Starting chat...');
                // You can replace this with actual navigation:
                // window.location.href = '/chat';
                alert('جاهز لبدء الدردشة!');
            }, 150);
        });

        // Add keyboard support
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                document.getElementById('startBtn').click();
            }
        });

        // Prevent scrolling
        document.body.style.overflow = 'hidden';
    </script>
</body>
</html>
